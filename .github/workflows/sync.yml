name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          base=$(git merge-base HEAD upstream/main)
          local=$(git rev-list --count ${base}..HEAD)
          ahead=$(git rev-list --count upstream/main..HEAD)

          echo "本地独占提交: $local, 领先上游: $ahead"

          if [ "$local" -eq 0 ] && [ "$ahead" -gt 0 ]; then
            # 只有上游快进 + 多余的 merge commit，没有自己的改动，可以安全对齐
            git reset --hard upstream/main
            git push --force-with-lease origin main
            echo "已快进对齐上游，清理了 $ahead 个多余 merge commit"
          elif [ "$local" -eq 0 ]; then
            echo "已是最新，无需操作"
          else
            # 有本地修改，只做合并，绝不覆盖
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并上游变更产生冲突，请手动 Sync Fork 并解决冲突。"
              exit 1
            fi
            git push origin main
          fi
